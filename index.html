<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhET Route — Stage 1 grey-box</title>
<style>
  :root {
    --chip: rgba(9,14,24,.74);
    --chip-line: rgba(255,255,255,.15);
    --ink: #e8eef6;
    --ink-dim: rgba(232,238,246,.62);
    --rule: rgba(255,255,255,.42);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  /* HUD stays light-on-dark at every stop. An earlier pass flipped it to dark ink
     over bright skies, but a dusk sky is bright at the horizon and dark at the
     zenith, so one global flip always stranded half the HUD. Translucent dark
     chips plus the scrims read against sand and against deep space both. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #05060a; }
  body { font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
         cursor: grab; user-select: none; -webkit-user-select: none;
         --passage: 0; }
  body:active { cursor: grabbing; }

  /* ------------------------------------------------------------------- sky */
  #sky { position: fixed; inset: 0; z-index: 0; }
  #stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; }
  #stars i { position: absolute; border-radius: 50%; background: #fff; }
  #celestial { position: fixed; z-index: 2; pointer-events: none; opacity: 0;
    transform: translate(-50%,-50%); border-radius: 50%; }
  #viewport { position: fixed; inset: 0; z-index: 3; overflow: hidden; }
  #world { position: absolute; left: 50%; top: 50%; width: 0; height: 0;
           transform-origin: 50% 50%; }
  #vignette { position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(125% 95% at 50% 45%, transparent 42%, rgba(0,0,0,.5) 100%); }
  #passage-tint { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
    background: radial-gradient(80% 60% at 50% 50%, rgba(255,235,200,.55), rgba(120,20,60,.5) 70%, rgba(0,0,0,.7)); }

  /* ---------------------------------------------------------------- scenes */
  .scene { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; --lbl: 1;
           --pxu: 0px; --pyu: 0px; }
  .scene-frame { position: absolute; inset: 0; border: 1px dashed rgba(255,255,255,.10);
                 border-radius: 6px; }
  body.show-grid .scene-frame {
    background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 60px 60px; }

  /* Depth layers. --pf is (parallax factor - 1); --pxu / --pyu are the camera's
     offset expressed in this scene's own units, so pxu * pf lands the layer at
     pf+1 times the camera travel. far drifts, near overshoots — sideways along
     the ground band, and vertically as the ascent lifts off the Flatirons. */
  .layer { position: absolute; inset: 0; }
  .layer-far  { --pf: -.74; }
  .layer-mid  { --pf:  0;   }
  .layer-near { --pf:  .42; }
  .layer { transform: translate3d(calc(var(--pxu) * var(--pf)),
                                   calc(var(--pyu) * var(--pf)), 0); }

  /* Top-centre: the only edge of a scene the corner HUD never reaches, and it
     labels the half-visible neighbours you can see to either side. */
  .plate { position: absolute; left: 0; width: 100%;
    opacity: calc(var(--lbl) * .85 * (1 - var(--passage)));
    display: flex; align-items: center; justify-content: center; gap: 9px; }
  .plate-rule { width: 26px; height: 1px; background: var(--rule); }
  .plate-label { font: 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .22em;
    color: var(--ink); padding: 4px 9px 5px; border-radius: 4px; background: var(--chip); }

  /* abstract geometry */
  .glow { position: absolute; left: 50%; top: 50%; width: 820px; height: 820px;
    margin: -410px 0 0 -410px; border-radius: 50%;
    background: radial-gradient(circle, rgba(180,210,255,.20), transparent 62%); }
  .ring { position: absolute; border: 1px dashed rgba(190,215,255,.6); border-radius: 50%; }
  .core { position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #fff, rgba(150,190,255,.55) 60%, rgba(90,120,200,.2));
    box-shadow: 0 0 60px rgba(160,200,255,.5); }
  .speck { position: absolute; border-radius: 50%; background: rgba(220,235,255,.6); }

  /* A nucleus is packed nucleons, not one smooth ball — and it is the only thing
     in the frame at that scale, so it has to carry it. */
  .nucleon { position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fff2f4, #e2607a 52%, #7e1f38 100%);
    box-shadow: inset 0 -3px 7px rgba(0,0,0,.35), 0 0 14px rgba(226,96,122,.3); }
  .neutron {
    background: radial-gradient(circle at 34% 30%, #f2f6ff, #7f93b4 52%, #2b3550 100%);
    box-shadow: inset 0 -3px 7px rgba(0,0,0,.4), 0 0 14px rgba(127,147,180,.26); }

  /* Neural tissue: cells with dendrites and an axon, not a blob. */
  .neuron-cell { position: absolute; width: 0; height: 0; }
  .soma { position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #ffffff, #c6dcff 44%, #4c72ba 100%);
    box-shadow: 0 0 26px rgba(150,190,255,.45), inset 0 -4px 9px rgba(0,0,0,.22); }

  /* The molecule band: several small assemblies rather than one object. */
  .molecule { position: absolute; width: 0; height: 0; }
  .atom { position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #fdfdff, #8fb6ff 50%, #2b4a8c 100%);
    box-shadow: inset 0 -4px 9px rgba(0,0,0,.32), 0 0 18px rgba(143,182,255,.28); }
  .atom-b {
    background: radial-gradient(circle at 34% 28%, #fff6f2, #f0947e 50%, #93372c 100%);
    box-shadow: inset 0 -4px 9px rgba(0,0,0,.32), 0 0 18px rgba(240,148,126,.24); }

  /* Up top: thin air, then the planet you climbed off. */
  .limb-haze { position: absolute; border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    background: linear-gradient(180deg, rgba(120,180,255,.42), rgba(40,80,160,.12) 45%, transparent); }
  .planet { position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 36% 26%, #6f9fd8, #2e5b96 46%, #0d2246 78%, #061024 100%);
    box-shadow: 0 0 90px 20px rgba(90,150,230,.22); }
  .planet-rim { position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, transparent 0 96%, rgba(150,205,255,.5) 98%, transparent 100%); }

  /* Surface geometry. The bands run far wider than a scene so that a neighbour's
     edge never shows up as a vertical seam once parallax pulls the layers apart. */
  .ground { position: absolute; left: -1400px; width: 4000px;
    background: linear-gradient(180deg, rgba(22,30,26,.58), rgba(10,14,18,.74)); }
  .horizon { position: absolute; left: -1400px; width: 4000px; height: 0;
    border-top: 1px solid rgba(255,255,255,.34); }
  .haze { position: absolute; left: -1400px; width: 4000px; height: 130px;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,.16)); }
  .fore { position: absolute; left: -1400px; width: 4000px;
    background: linear-gradient(180deg, rgba(6,9,14,.16), rgba(4,6,10,.46)); }
  .shape { position: absolute; }
  .solid  { background: rgba(18,24,34,.78); border: 1px solid rgba(255,255,255,.4); }
  .thin   { background: rgba(255,255,255,.42); }
  .outline{ border: 1px solid rgba(255,255,255,.4); }
  .far-tone { opacity: .44; }
  .building { background: rgba(14,20,30,.7); border: 1px solid rgba(255,255,255,.32);
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.13) 0 2px, transparent 2px 26px),
                      repeating-linear-gradient(90deg, rgba(255,255,255,.13) 0 2px, transparent 2px 22px); }
  .hill { background: rgba(20,26,34,.6); border: 1px solid rgba(255,255,255,.3);
    border-radius: 62% 38% 0 0 / 92% 84% 0 0; }
  .tree { background: rgba(16,24,22,.6); border: 1px solid rgba(255,255,255,.26);
    border-radius: 50% 50% 18% 18%; }
  .slab { background: linear-gradient(100deg, rgba(44,28,34,.86), rgba(20,14,22,.9));
    border: 1px solid rgba(255,255,255,.38); border-radius: 6px 34px 0 0; }
  .water { background: linear-gradient(180deg, rgba(70,130,180,.4), rgba(30,60,96,.5));
    border-top: 1px solid rgba(255,255,255,.4); }
  .door { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.36);
    border-radius: 4px 4px 0 0; }
  /* opaque: the one landmark that is indoors has to hide the sky and the
     half-visible neighbours, or the corridor reads as a street */
  .interior { background: linear-gradient(180deg, rgba(24,28,36,.97), rgba(40,44,53,.97)); }
  .rock { background: rgba(22,25,32,.88); border: 1px solid rgba(255,255,255,.34);
    border-radius: 44% 56% 22% 18% / 62% 58% 30% 34%; }
  .scrub { background: rgba(18,26,20,.7); border: 1px solid rgba(255,255,255,.24);
    border-radius: 50% 50% 30% 30%; }
  .fire { border-radius: 50% 50% 40% 40%;
    background: radial-gradient(circle at 50% 78%, rgba(255,224,150,.95), rgba(255,132,50,.6) 55%, transparent 72%); }
  .beam { position: absolute; width: 0; height: 0; opacity: .45;
    border-top: 90px solid transparent; border-bottom: 90px solid transparent;
    border-left: 900px solid rgba(255,240,170,.32); }
  .field-layer { position: absolute; left: 0; width: 1200px;
    background: repeating-linear-gradient(90deg, rgba(56,189,248,.16) 0 1px, transparent 1px 46px),
                repeating-linear-gradient(0deg, rgba(56,189,248,.12) 0 1px, transparent 1px 46px); }
  .note-tag, .zone-tag, .zone-label { position: absolute; font: 10px/1.4 var(--mono);
    text-transform: uppercase; letter-spacing: .14em; color: var(--ink);
    opacity: calc(var(--lbl) * .72 * (1 - var(--passage)));
    text-shadow: 0 1px 5px rgba(0,0,0,.55); }
  .note-tag { text-transform: none; letter-spacing: .04em;
    opacity: calc(var(--lbl) * .62 * (1 - var(--passage))); }
  .zone-label { width: 104px; text-align: right; }

  /* PhET skater sprites. Sized in scene units like everything else, so they
     scale with the camera and parallax with whatever layer they sit in. */
  .char { position: absolute; background-repeat: no-repeat; background-size: 100% 100%;
    background-position: center bottom; pointer-events: none; }

  /* sim slots */
  /* No backdrop-filter here, however good it looks. There are ~78 of these and
     they live inside layers that are transformed and opacity-animated every
     frame, which is the worst case for it. If the route ever needs the glass
     look back, put it on the readout chip alone and leave the slots flat. */
  /* Exactly 120x80 — the size of a PhET sim icon. These are placeholders for the
     real thumbnail, so they hold its footprint and nothing overflows it. */
  .slot { position: absolute; width: 120px; height: 80px; padding: 6px 7px 5px;
    border-radius: 5px; overflow: hidden; display: flex; flex-direction: column;
    background: rgba(8,12,20,.76); border: 1px solid rgba(255,255,255,.2);
    border-left-width: 3px; border-left-style: solid;
    opacity: calc(var(--lbl) * (1 - var(--passage)));
    box-shadow: 0 3px 14px rgba(0,0,0,.4); color: #e8eef6; }
  .slot-name { font-size: 10.5px; font-weight: 600; line-height: 1.22;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .slot-meta { display: flex; align-items: center; gap: 3px; margin-top: auto; }
  .dot { width: 5px; height: 5px; border-radius: 50%; flex: none; }
  .dot-sec { width: 4px; height: 4px; opacity: .6; }
  .idle { font: 8px var(--mono); letter-spacing: .06em; padding: 0 2px; border-radius: 2px;
    background: rgba(255,255,255,.14); flex: none; }
  .slug { font: 8px var(--mono); opacity: .4; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .variant { display: inline-block; margin: 3px 3px 0 0; font: 8px var(--mono);
    letter-spacing: .04em; padding: 0 3px; border-radius: 2px;
    border: 1px dashed rgba(255,255,255,.42); opacity: .75; }
  .slot-vars { display: flex; flex-wrap: wrap; }
  /* leader from a slot down to the spot on the ground it belongs to */
  .leader { position: absolute; width: 1px; background: linear-gradient(180deg,
    rgba(255,255,255,.34), rgba(255,255,255,.06));
    opacity: calc(var(--lbl) * .7 * (1 - var(--passage))); }
  .peg { position: absolute; width: 5px; height: 5px; margin-left: -2px; margin-top: -2px;
    border-radius: 50%; background: rgba(255,255,255,.62);
    box-shadow: 0 0 8px rgba(255,255,255,.5);
    opacity: calc(var(--lbl) * .8 * (1 - var(--passage))); }

  /* ------------------------------------------------------------------- hud */
  #hud { position: fixed; inset: 0; z-index: 8; pointer-events: none; color: var(--ink); }
  body.hide-hud #hud, body.hide-hud #scrims { opacity: 0; }
  #scrims { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
  #scrims div { position: absolute; left: 0; right: 0; height: 130px; }
  #scrim-t { top: 0; height: 110px; background: linear-gradient(180deg, rgba(0,0,0,.26), transparent); }
  #scrim-b { bottom: 0; height: 150px; background: linear-gradient(0deg, rgba(0,0,0,.46), transparent); }

  #readout { position: absolute; left: 22px; top: 18px; padding: 11px 15px 12px;
    background: var(--chip); border: 1px solid var(--chip-line); border-radius: 10px;
    max-width: 370px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #h-section { font: 10px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .18em;
    color: var(--ink-dim); }
  #h-landmark { font-size: 21px; font-weight: 650; letter-spacing: -.01em; margin: 2px 0 4px; }
  #h-line { display: flex; gap: 10px; align-items: baseline; font: 11px var(--mono);
    color: var(--ink-dim); }
  #h-scale sup { font-size: .7em; }
  #h-note { margin-top: 8px; font-size: 11.5px; line-height: 1.45; color: var(--ink-dim); }

  #ruler { position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
    height: 306px; width: 150px; display: flex; flex-direction: column;
    justify-content: space-between; }
  .tick { display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    font: 9.5px var(--mono); text-transform: uppercase; letter-spacing: .12em; }
  .tick-label { padding: 2px 6px; border-radius: 4px; background: var(--chip);
    border: 1px solid transparent; color: var(--ink-dim); }
  .tick.on .tick-label { color: var(--ink); border-color: var(--chip-line); }
  .tick-dash { display: block; width: 14px; height: 1px; background: var(--rule); order: 2;
    opacity: .7; }
  .tick.on .tick-dash { width: 24px; height: 2px; opacity: 1; }
  .ruler-marker { position: absolute; right: -5px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink); box-shadow: 0 0 12px rgba(255,255,255,.55); margin-top: -4px; }
  /* the human band is 6 lateral stops on one rung — this shows where along it you are */
  #lat { position: absolute; right: 0; width: 96px; height: 2px; margin-top: -1px;
    background: var(--rule); opacity: 0; }
  #lat-fill { position: absolute; left: 0; top: -1px; height: 4px; background: var(--ink);
    border-radius: 2px; box-shadow: 0 0 8px rgba(255,255,255,.5); }

  #legend { position: absolute; right: 24px; top: 20px; display: flex; flex-direction: column;
    align-items: flex-end; gap: 3px; font: 9.5px var(--mono); text-transform: uppercase;
    letter-spacing: .1em; text-shadow: 0 1px 5px rgba(0,0,0,.8); }
  body.hide-legend #legend { display: none; }
  #legend div { display: flex; align-items: center; gap: 6px; color: var(--ink-dim); }
  #legend .sw { order: 3; width: 7px; height: 7px; border-radius: 50%; }
  #legend .n { order: 2; opacity: .5; min-width: 14px; text-align: right; }

  #dots { position: absolute; left: 0; right: 0; bottom: 52px; display: flex;
    justify-content: center; align-items: flex-end; pointer-events: auto; }
  .dot-stop { position: relative; width: 30px; height: 30px; background: none; border: 0;
    padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .dot-stop.gap { margin-left: 18px; }
  .dot-mark { width: 6px; height: 6px; border-radius: 50%; background: var(--rule);
    transition: all .18s ease; }
  .dot-stop.near .dot-mark { background: var(--ink); opacity: .7; }
  .dot-stop.on .dot-mark { width: 10px; height: 10px; background: var(--ink); opacity: 1;
    box-shadow: 0 0 14px rgba(255,255,255,.7); }
  .dot-name { position: absolute; bottom: 27px; white-space: nowrap; font: 9.5px var(--mono);
    letter-spacing: .08em; opacity: 0; transform: translateY(4px); transition: all .18s ease;
    padding: 2px 6px; border-radius: 4px; background: var(--chip); color: var(--ink); }
  .dot-stop.on .dot-name, .dot-stop:hover .dot-name { opacity: 1; transform: none; }

  #hints { position: absolute; right: 24px; bottom: 20px; text-align: right;
    font: 9.5px/1.7 var(--mono); letter-spacing: .1em; color: var(--ink-dim);
    text-shadow: 0 1px 5px rgba(0,0,0,.8); }
  kbd { font: inherit; padding: 0 3px; border: 1px solid var(--rule); border-radius: 3px; }

  /* Below the readout, whatever height the readout happens to be. The scene's own
     labels fade out under it (see --passage), so this never lands on top of text. */
  #banner { position: absolute; left: 50%; top: 190px; transform: translateX(-50%);
    text-align: center; opacity: 0; width: min(620px, 74vw); color: #f2f6fb;
    padding: 14px 22px 16px; border-radius: 12px; background: rgba(6,9,16,.62);
    border: 1px solid rgba(255,255,255,.12); }
  #banner-title { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .3em;
    opacity: .85; }
  #banner-note { margin-top: 10px; font-size: 15px; line-height: 1.5;
    text-shadow: 0 2px 20px rgba(0,0,0,.85); }

  #stage { position: absolute; left: 22px; bottom: 20px; font: 9.5px/1.6 var(--mono);
    letter-spacing: .12em; color: var(--ink-dim); text-shadow: 0 1px 5px rgba(0,0,0,.8); }
</style>
</head>
<body>
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="celestial"></div>
  <div id="viewport"><div id="world"></div></div>
  <div id="vignette"></div>
  <div id="passage-tint"></div>
  <div id="scrims"><div id="scrim-t"></div><div id="scrim-b"></div></div>

  <div id="hud">
    <div id="readout">
      <div id="h-section"></div>
      <div id="h-landmark"></div>
      <div id="h-line"><span id="h-scale"></span><span id="h-count"></span></div>
      <div id="h-note"></div>
    </div>

    <div id="ruler"></div>
    <div id="lat"><div id="lat-fill"></div></div>
    <div id="legend"></div>
    <div id="dots"></div>

    <div id="banner">
      <div id="banner-title"></div>
      <div id="banner-note"></div>
    </div>

    <div id="hints">
      scroll / drag to travel<br>
      <kbd>↑</kbd><kbd>↓</kbd> stop to stop · <kbd>Home</kbd><kbd>End</kbd> ends<br>
      <kbd>g</kbd> grid · <kbd>l</kbd> legend · <kbd>h</kbd> hide hud
    </div>
    <div id="stage">stage 1 — grey-box route · geometry stands in for art</div>
  </div>

  <script src="route-data.js"></script>
  <script src="route-app.js"></script>
</body>
</html>
